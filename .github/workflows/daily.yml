name: Daily S&P 500 tracker

on:
  schedule:
    - cron: "15 22 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r requirements.txt

      - name: Run tracker
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          REQUIRE_TODAY: ${{ github.event_name == 'schedule' && '1' || '0' }}
        run: python tracker.py

      - name: Save shares cache
        if: always()
        run: |
          git config user.name "tracker-bot"
          git config user.email "tracker-bot@users.noreply.github.com"
          git add shares_cache.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Update shares cache" && git push)
